<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026年最适合你的行业测试</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0a0e27;--card:#141831;--primary:#4f6ef7;--accent:#00d4ff;--gold:#ffd700;--success:#10b981;--text:#e8eaf6;--text-dim:#8892b0}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
    body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 30% 20%,rgba(79,110,247,.15) 0%,transparent 50%),radial-gradient(ellipse at 70% 80%,rgba(0,212,255,.1) 0%,transparent 50%);pointer-events:none}
    .container{max-width:600px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column;justify-content:center}
    .card{background:var(--card);border-radius:24px;padding:40px 32px;position:relative;overflow:hidden;border:1px solid rgba(79,110,247,.2);box-shadow:0 25px 50px -12px rgba(0,0,0,.5)}
    .card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--primary),var(--accent),var(--gold))}
    h1{font-family:'Noto Serif SC',serif;font-size:26px;text-align:center;margin-bottom:12px;background:linear-gradient(135deg,var(--text),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .subtitle{text-align:center;color:var(--text-dim);font-size:14px;margin-bottom:32px}
    input{width:100%;padding:16px 20px;border:2px solid rgba(79,110,247,.3);border-radius:12px;background:rgba(10,14,39,.8);color:var(--text);font-size:16px;outline:none;transition:all .3s}
    input:focus{border-color:var(--primary);box-shadow:0 0 20px rgba(79,110,247,.3)}
    input::placeholder{color:var(--text-dim)}
    .btn{width:100%;padding:18px;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;transition:all .3s;margin-top:20px}
    .btn-primary{background:linear-gradient(135deg,var(--primary),#6366f1);color:#fff}
    .btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(79,110,247,.4)}
    .btn-success{background:linear-gradient(135deg,var(--success),#059669);color:#fff}
    .btn-success:hover{box-shadow:0 10px 30px rgba(16,185,129,.4)}
    .progress-bar{height:4px;background:rgba(255,255,255,.1);border-radius:2px;margin-bottom:30px;overflow:hidden}
    .progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));transition:width .5s ease;border-radius:2px}
    .question-num{font-size:13px;color:var(--accent);margin-bottom:8px;letter-spacing:1px}
    .question-text{font-size:20px;font-weight:600;margin-bottom:28px;line-height:1.5}
    .options{display:flex;flex-direction:column;gap:12px}
    .option{padding:18px 20px;background:rgba(10,14,39,.6);border:2px solid rgba(79,110,247,.15);border-radius:12px;cursor:pointer;transition:all .3s;font-size:15px;line-height:1.5}
    .option:hover{border-color:var(--primary);background:rgba(79,110,247,.1);transform:translateX(4px)}
    .option.selected{border-color:var(--accent);background:rgba(0,212,255,.15)}
    .analyzing{text-align:center;padding:40px}
    .spinner{width:60px;height:60px;border:4px solid rgba(79,110,247,.2);border-top-color:var(--primary);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 24px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .paywall{text-align:center}
    .paywall-icon{font-size:48px;margin-bottom:16px}
    .paywall h2{font-family:'Noto Serif SC',serif;font-size:24px;margin-bottom:8px}
    .paywall p{color:var(--text-dim);margin-bottom:20px;font-size:14px}
    .price{font-size:36px;font-weight:700;color:var(--gold);margin-bottom:20px}
    .price span{font-size:16px;color:var(--text-dim)}
    .qr-tabs{display:flex;gap:12px;margin-bottom:20px}
    .qr-tab{flex:1;padding:12px;border-radius:10px;border:2px solid rgba(79,110,247,.2);cursor:pointer;transition:all .3s;background:transparent;color:var(--text-dim);font-size:14px;font-weight:500}
    .qr-tab.active{border-color:var(--success);background:rgba(16,185,129,.15);color:var(--success)}
    .qr-container{background:#fff;border-radius:16px;padding:16px;margin-bottom:16px;display:inline-block}
    .qr-container img{display:block;width:200px;height:200px;object-fit:contain}
    .qr-placeholder{width:200px;height:200px;background:#f5f5f5;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#999;font-size:14px;text-align:center;padding:20px}
    .qr-amount{font-size:18px;color:#333;font-weight:700;margin-bottom:6px}
    .qr-hint{font-size:12px;color:#666;margin-bottom:20px}
    .result-header{text-align:center;margin-bottom:32px}
    .result-emoji{font-size:64px;margin-bottom:16px}
    .result-title{font-family:'Noto Serif SC',serif;font-size:28px;margin-bottom:8px}
    .result-match{display:inline-block;padding:6px 16px;background:linear-gradient(135deg,var(--primary),var(--accent));border-radius:20px;font-size:14px;font-weight:600;margin-bottom:16px}
    .result-tagline{color:var(--accent);font-size:16px;font-weight:500}
    .result-section{margin-bottom:28px}
    .result-section h3{font-size:13px;color:var(--text-dim);margin-bottom:12px;letter-spacing:1px;text-transform:uppercase}
    .traits{display:flex;flex-wrap:wrap;gap:8px}
    .trait{padding:8px 16px;background:rgba(79,110,247,.2);border-radius:20px;font-size:13px;border:1px solid rgba(79,110,247,.3)}
    .result-desc{line-height:1.8;color:var(--text-dim);font-size:15px}
    .top3{display:flex;flex-direction:column;gap:10px}
    .top3-item{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:rgba(10,14,39,.6);border-radius:10px;border:1px solid rgba(79,110,247,.15)}
    .top3-name{font-weight:500}
    .top3-match{color:var(--success);font-weight:600}
    .fade-in{animation:fadeIn .5s ease}
    @keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
    .hidden{display:none!important}
    .share-hint{margin-top:16px;padding:14px;background:rgba(79,110,247,.1);border-radius:10px;font-size:13px;color:var(--text-dim);text-align:center;line-height:1.6}
  </style>
</head>
<body>
<div class="container">

  <!-- 开始页 -->
  <div class="card" id="start-screen">
    <h1>🔮 2026年行业适配测试</h1>
    <p class="subtitle">基于霍兰德职业兴趣理论 · 20道题 · 深度解析</p>
    <input type="text" id="nickname" placeholder="输入你的昵称（可选）" maxlength="20">
    <button class="btn btn-primary" onclick="startTest()">开始测试 →</button>
    <p style="text-align:center;margin-top:16px;font-size:12px;color:var(--text-dim)">完成后支付 ¥9.9 解锁完整结果</p>
  </div>

  <!-- 答题页 -->
  <div class="card hidden" id="question-screen">
    <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
    <div class="question-num" id="q-num">问题 1/20</div>
    <div class="question-text" id="q-text"></div>
    <div class="options" id="options"></div>
  </div>

  <!-- 分析中 -->
  <div class="card hidden" id="analyzing-screen">
    <div class="analyzing">
      <div class="spinner"></div>
      <p style="color:var(--text-dim);font-size:16px">AI 正在分析你的职业基因...</p>
    </div>
  </div>

  <!-- 付款页 -->
  <div class="card hidden" id="paywall-screen">
    <div class="paywall">
      <div class="paywall-icon">🔐</div>
      <h2>解锁完整结果</h2>
      <p>AI 分析完成，扫码支付 ¥9.9 即可查看</p>
      <div class="price">¥9.9 <span>/ 永久查看</span></div>
      <div class="qr-tabs">
        <button class="qr-tab active" id="tab-wx" onclick="switchTab('wx')">💚 微信支付</button>
        <button class="qr-tab" id="tab-zfb" onclick="switchTab('zfb')">💙 支付宝</button>
      </div>
      <div id="qr-wx">
        <div class="qr-container">
          <!-- ★ 把你的微信收款码图片链接填到下面 src="" 里 -->
          <img id="img-wx" src="" alt="微信收款码" onerror="this.parentNode.innerHTML='<div class=qr-placeholder>请联系作者<br>获取收款码</div>'">
        </div>
        <div class="qr-amount">¥9.9</div>
        <div class="qr-hint">长按识别二维码 · 转账备注「行业测试」</div>
      </div>
      <div id="qr-zfb" class="hidden">
        <div class="qr-container">
          <!-- ★ 把你的支付宝收款码图片链接填到下面 src="" 里 -->
          <img id="img-zfb" src="" alt="支付宝收款码" onerror="this.parentNode.innerHTML='<div class=qr-placeholder>请联系作者<br>获取收款码</div>'">
        </div>
        <div class="qr-amount">¥9.9</div>
        <div class="qr-hint">长按识别二维码 · 转账备注「行业测试」</div>
      </div>
      <div style="margin-top:20px;padding-top:20px;border-top:1px solid rgba(79,110,247,.2)">
        <p style="font-size:14px;color:var(--accent);margin-bottom:12px">🔑 付款后请输入验证码解锁结果</p>
        <input type="text" id="verify-code" placeholder="请输入验证码" style="width:100%;padding:14px 16px;border:2px solid rgba(79,110,247,.3);border-radius:10px;background:rgba(10,14,39,.8);color:var(--text);font-size:15px;outline:none;text-align:center;letter-spacing:4px;margin-bottom:12px" onfocus="this.style.borderColor='var(--primary)'" onblur="this.style.borderColor='rgba(79,110,247,.3)'">
        <div id="verify-error" style="color:#ef4444;font-size:13px;margin-bottom:10px;display:none">验证码错误，请确认后重试</div>
        <button class="btn btn-success" onclick="verifyAndUnlock()">🔓 验证并查看结果</button>
      </div>
    </div>
  </div>

  <!-- 结果页 -->
  <div class="card hidden" id="result-screen">
    <div class="result fade-in">
      <div class="result-header">
        <div class="result-emoji" id="r-emoji"></div>
        <div class="result-title" id="r-title"></div>
        <div class="result-match">匹配度 <span id="r-match"></span>%</div>
        <div class="result-tagline" id="r-tagline"></div>
      </div>
      <div class="result-section">
        <h3>你的核心特质</h3>
        <div class="traits" id="r-traits"></div>
      </div>
      <div class="result-section">
        <h3>深度分析</h3>
        <p class="result-desc" id="r-desc"></p>
      </div>
      <div class="result-section">
        <h3>行业前景</h3>
        <p class="result-desc" id="r-outlook"></p>
      </div>
      <div class="result-section">
        <h3>发展建议</h3>
        <p class="result-desc" id="r-advice"></p>
      </div>
      <div class="result-section">
        <h3>推荐岗位 TOP 3</h3>
        <div class="top3" id="r-top3"></div>
      </div>
      <button class="btn btn-primary" onclick="location.reload()">🔄 重新测试</button>
      <div class="share-hint">💡 觉得准？截图分享给朋友，让他们也来测测～</div>
    </div>
  </div>

</div>

<script>

  {q:"深夜你突然有了一个想法，你最可能？",options:["立即画思维导图或写代码验证可行性","记录灵感碎片，想象它的各种可能","翻来覆去想它是否靠谱，有没有先例","兴奋地想如何把它变成一门生意"],scores:[{INNOVATION:2,ANALYTICS:1},{CREATIVITY:2,INNOVATION:1},{STRUCTURE:2,ANALYTICS:1},{LEADERSHIP:2,CREATIVITY:1}]},
  {q:"你觉得「聪明」最重要的是？",options:["逻辑清晰，能看透事物本质","想象力丰富，能看到别人看不到的","执行力强，把想法变成现实","共情力强，能理解人心和需求"],scores:[{ANALYTICS:3},{CREATIVITY:3},{STRUCTURE:3,LEADERSHIP:1},{EMPATHY:3}]},

  {q:"开会讨论时，你通常？",options:["静静分析，在关键时刻提出关键问题","天马行空，经常提出意想不到的角度","认真记录，确保讨论不偏离主题","掌控节奏，推动讨论走向决策"],scores:[{ANALYTICS:2,INNOVATION:1},{CREATIVITY:2,INNOVATION:1},{STRUCTURE:2,EMPATHY:1},{LEADERSHIP:2,STRUCTURE:1}]},
  {q:"你更享受哪种成就感？",options:["攻克了一个别人解决不了的技术难题","创作了一件让人赞叹的作品/内容","建立了一套高效运转的体系/流程","带领团队达成一个了不起的目标"],scores:[{INNOVATION:3},{CREATIVITY:3},{STRUCTURE:3},{LEADERSHIP:3}]},
  {q:"你的理想工作日是怎样的？",options:["戴上耳机，沉浸式攻克一个技术难关","自由探索，在灵感来时高效输出","按计划推进，每完成一项打个勾","密集沟通，和各种人碰撞火花"],scores:[{INNOVATION:2,ANALYTICS:1},{CREATIVITY:2,INNOVATION:1},{STRUCTURE:2,ANALYTICS:1},{LEADERSHIP:2,EMPATHY:1}]},
  {q:"如果薪水一样，你最看重什么？",options:["技术前沿感，接触行业最领先的东西","创作自由度，能按自己的方式表达","稳定安全感，有清晰的成长路径","影响力，你的工作能改变很多人"],scores:[{INNOVATION:3},{CREATIVITY:3},{STRUCTURE:3},{LEADERSHIP:2,EMPATHY:1}]},

// ============================================================
// 状态
// ============================================================
let currentQ = 0;
let scores = {INNOVATION:0,ANALYTICS:0,CREATIVITY:0,LEADERSHIP:0,EMPATHY:0,STRUCTURE:0};
let computedResult = null;

// ============================================================
// 逻辑
// ============================================================
function startTest(){
  showScreen('question-screen');
  showQuestion();
}

function showScreen(id){
  ['start-screen','question-screen','analyzing-screen','paywall-screen','result-screen']
    .forEach(s=>document.getElementById(s).classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

function showQuestion(){
  const q = questions[currentQ];
  document.getElementById('progress').style.width = ((currentQ+1)/questions.length*100)+'%';
  document.getElementById('q-num').textContent = `问题 ${currentQ+1}/${questions.length}`;
  document.getElementById('q-text').textContent = q.q;
  document.getElementById('options').innerHTML = q.options.map((opt,i)=>
    `<div class="option" onclick="selectOption(${i})">${opt}</div>`
  ).join('');
}

function selectOption(idx){
  // 视觉反馈
  document.querySelectorAll('.option').forEach((el,i)=>{
    if(i===idx) el.classList.add('selected');
  });
  // 累加分数
  const addScores = questions[currentQ].scores[idx];
  for(const [k,v] of Object.entries(addScores)) scores[k]=(scores[k]||0)+v;
  currentQ++;
  if(currentQ < questions.length){
    setTimeout(showQuestion, 300);
  } else {
    showScreen('analyzing-screen');
    setTimeout(()=>{
      computedResult = calcResult();
      showScreen('paywall-screen');
    }, 2000);
  }
}

function calcResult(){
  // 找最高维度
  const sorted = Object.entries(scores).sort((a,b)=>b[1]-a[1]);
  const topDim = sorted[0][0];
  return RESULTS[topDim] || RESULTS.INNOVATION;
}

function switchTab(tab){
  document.getElementById('tab-wx').classList.toggle('active', tab==='wx');
  document.getElementById('tab-zfb').classList.toggle('active', tab==='zfb');
  document.getElementById('qr-wx').classList.toggle('hidden', tab!=='wx');
  document.getElementById('qr-zfb').classList.toggle('hidden', tab!=='zfb');
}

function verifyAndUnlock(){
  const code = document.getElementById('verify-code').value.trim();
  const errorEl = document.getElementById('verify-error');
  if(code !== '2026'){
    errorEl.style.display = 'block';
    setTimeout(()=>errorEl.style.display='none', 3000);
    return;
  }
  errorEl.style.display = 'none';
  unlockResult();
}

function unlockResult(){
  if(!computedResult) return;
  const r = computedResult;
  document.getElementById('r-emoji').textContent = r.emoji;
  document.getElementById('r-title').textContent = r.name;
  document.getElementById('r-match').textContent = r.match;
  document.getElementById('r-tagline').textContent = r.tagline;
  document.getElementById('r-traits').innerHTML = r.traits.map(t=>`<span class="trait">${t}</span>`).join('');
  document.getElementById('r-desc').textContent = r.description;
  document.getElementById('r-outlook').textContent = r.outlook;
  document.getElementById('r-advice').textContent = r.advice;
  document.getElementById('r-top3').innerHTML = r.top3.map(t=>
    `<div class="top3-item"><span class="top3-name">${t.name}</span><span class="top3-match">${t.match}%</span></div>`
  ).join('');
  showScreen('result-screen');
}
